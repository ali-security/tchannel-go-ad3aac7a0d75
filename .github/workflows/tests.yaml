name: Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional go test -run regex; empty runs the full suite"
        required: false
        default: ""

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"
        cache: false

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build module zip
      run: |
        set -eux
        HELPER="$RUNNER_TEMP/modzip"
        OUT="$RUNNER_TEMP/out/v1.22.1-0.20240528171429-1db37fdea938.zip"
        mkdir -p "$HELPER" "$RUNNER_TEMP/out"
        cat > "$HELPER/main.go" <<'EOF'
        package main

        import (
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
        )

        func main() {
            f, err := os.Create(os.Args[4])
            if err != nil {
                panic(err)
            }
            defer f.Close()
            if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[3]); err != nil {
                panic(err)
            }
        }
        EOF
        cd "$HELPER"
        go mod init example.com/modzip
        go get golang.org/x/mod@v0.24.0
        go build -o "$RUNNER_TEMP/create_mod" .
        "$RUNNER_TEMP/create_mod" github.com/temporalio/tchannel-go v1.22.1-0.20240528171429-1db37fdea938 "$GITHUB_WORKSPACE" "$OUT"
        unzip -Z1 "$OUT" | wc -l
        test "$(unzip -Z1 "$OUT" | wc -l)" -eq 353

    - name: Upload module zip
      uses: actions/upload-artifact@v4
      with:
        name: module-zip
        path: ${{ runner.temp }}/out/v1.22.1-0.20240528171429-1db37fdea938.zip
        if-no-files-found: error

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/temporalio/tchannel-go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.17.x", "1.21.x"]
        include:
        # Go < 1.22 test binaries abort on current macOS (dyld: missing LC_UUID)
        - os: macos-latest
          go: 1.23.x

    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: false

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: ${{ env.GOPATH }}/src/github.com/temporalio/tchannel-go

    - name: Load cache
      uses: actions/cache@v4
      with:
        path: ~/.glide/cache
        key: ${{ runner.os }}-go-${{ hashFiles('**/glide.lock') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build Thrift 0.16.0 compiler (macOS)
      if: runner.os == 'macOS'
      run: |
        set -eux
        brew install bison flex
        export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
        export CMAKE_POLICY_VERSION_MINIMUM=3.5
        T="$RUNNER_TEMP/thrift"
        mkdir -p "$T/src" "$T/build"
        curl -fsSL https://archive.apache.org/dist/thrift/0.16.0/thrift-0.16.0.tar.gz -o "$T/thrift-0.16.0.tar.gz"
        echo "f460b5c1ca30d8918ff95ea3eb6291b3951cf518553566088f3f2be8981f6209  $T/thrift-0.16.0.tar.gz" | shasum -a 256 -c
        tar -xf "$T/thrift-0.16.0.tar.gz" --strip-components=1 -C "$T/src"
        THRIFT_SRC="$T/src" THRIFT_BUILD="$T/build" scripts/build-thrift.sh
        mkdir -p .bin
        cp "$T/build/bin/Release/thrift" .bin/thrift
        .bin/thrift --version

    - name: Install CI
      run: make install_ci

    - name: Test CI
      env:
        NO_TEST: ${{ matrix.NO_TEST }}
        # testutils' own knob for slow runners; timing asserts flake under -race
        TEST_TIMEOUT_SCALE: "3"
      run: |
        set -o pipefail
        LOG="$RUNNER_TEMP/go-test.log"
        if [ -n "${{ inputs.test-filter }}" ]; then
          # space-separated test names -> a single go test -run alternation
          RUN_RE="$(printf '%s' '${{ inputs.test-filter }}' | tr -s ' ' '|')"
          PATH="$PWD/.bin:$PATH" go test -parallel=4 -race -v -timeout 5m -run "$RUN_RE" ./... 2>&1 | tee "$LOG"
        else
          test -n "$NO_TEST" || make test_ci 2>&1 | tee "$LOG"
        fi
        awk '/^ *--- PASS/{p++} /^--- PASS/{tp++} /^ *--- FAIL/{f++} /^ *--- SKIP/{s++} /^ok /{ok++} /^FAIL/{pf++} END{printf "=== go test summary: %d tests passed (%d top-level, rest subtests), %d failed, %d skipped; %d packages ok, %d packages failed ===\n", p, tp, f, s, ok, pf}' "$LOG"

    - name: Crossdock CI
      run: make crossdock_logs_ci
